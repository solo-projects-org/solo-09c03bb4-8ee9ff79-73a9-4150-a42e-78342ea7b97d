services:
  archive:
    build: .
    image: wastewater-archive:local
    container_name: wastewater-archive
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/archive.db
    volumes:
      - archive-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  archive-data:

{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>{{ title }}</h1>

  <div class="row">
    {% if day_date %}<a class="button" href="/day/{{ day_date }}">返回该日档</a>{% endif %}
    <a class="button secondary" href="/">返回总览</a>
  </div>
</section>
{% endblock %}
